	<head><script>// WebGL call census for the probe: counts every WebGL2 call per second and records which ones
// target the default (visible) framebuffer, so the iPhone screenshot shows exactly how Godot
// presents frames.
(function () {
  var P = WebGL2RenderingContext.prototype, counts = {}, nullOps = {}, first = [], frameNo = 0, lastSec = {}, lastNull = {};
  var boundDraw = null, boundRead = null, rets = {}, lastRets = {};
  Object.getOwnPropertyNames(P).forEach(function (k) {
    var d = Object.getOwnPropertyDescriptor(P, k);
    if (!d || typeof d.value !== 'function' || k === 'constructor') return;
    var orig = d.value;
    P[k] = function () {
      counts[k] = (counts[k] || 0) + 1;
      var a = arguments;
      if (k === 'bindFramebuffer') {
        if (a[0] === 0x8D40 || a[0] === 0x8CA9) boundDraw = a[1];   // FRAMEBUFFER / DRAW_FRAMEBUFFER
        if (a[0] === 0x8D40 || a[0] === 0x8CA8) boundRead = a[1];   // FRAMEBUFFER / READ_FRAMEBUFFER
      }
      if (boundDraw === null && /^(clear|drawArrays|drawElements|blitFramebuffer|invalidateFramebuffer|invalidateSubFramebuffer|clearBuffer.*)$/.test(k)) {
        var key = k + (k === 'invalidateFramebuffer' ? '(' + a[0] + ':' + Array.prototype.join.call(a[1] || [], ',') + ')' : '');
        nullOps[key] = (nullOps[key] || 0) + 1;
      }
      if (k === 'invalidateFramebuffer' || k === 'invalidateSubFramebuffer') {
        var key2 = k + '(fb ' + (boundDraw === null ? 'SCREEN' : 'offscreen') + ' att ' + Array.prototype.join.call(a[1] || [], ',') + ')';
        counts[key2] = (counts[key2] || 0) + 1;
      }
      if (first.length < 40 && /Framebuffer|clear|blit|invalidate|viewport|scissor/.test(k)) first.push(k + (k === 'bindFramebuffer' ? '(' + a[0] + ',' + (a[1] === null ? 'null' : 'fbo') + ')' : ''));
      var r = orig.apply(this, a);
      if (/^(clientWaitSync|getSyncParameter|fenceSync|deleteSync)$/.test(k)) {
        var rk = k + '=>' + (k === 'fenceSync' ? (r ? 'sync' : 'null') : String(r));
        rets[rk] = (rets[rk] || 0) + 1;
      }
      return r;
    };
  });
  setInterval(function () {
    lastSec = counts; lastNull = nullOps; lastRets = rets; counts = {}; nullOps = {}; rets = {};
    var top = Object.keys(lastSec).sort(function (x, y) { return lastSec[y] - lastSec[x]; }).slice(0, 14)
      .map(function (k) { return k + ' ' + lastSec[k]; }).join(' | ');
    var el = document.getElementById('glspy');
    if (el) el.textContent = 'TO SCREEN/s: ' + JSON.stringify(lastNull) + '\nINVALIDATES/s: ' +
      Object.keys(lastSec).filter(function (k) { return /invalidate/.test(k); }).map(function (k) { return k + ' ' + lastSec[k]; }).join(' | ') +
      '\nSYNC/s: ' + JSON.stringify(lastRets) + '\nBUFFERS/s: ' +
      ['bufferData','bufferSubData','copyBufferSubData','texSubImage2D','texImage2D','flush','finish','readPixels','getBufferSubData','drawArrays','drawElements','drawArraysInstanced','drawElementsInstanced','uniformBlockBinding','bindBufferBase','bindBufferRange']
        .map(function (k) { return k + ' ' + (lastSec[k] || 0); }).join(' | ') +
      '\nTOP/s: ' + top + '\nFIRST: ' + first.join(' ');
  }, 1000);
})();
</script>

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"https://joshprier.dev/GameTests/drinkle/index","mainPack":"probe.pck","experimentalVK":false,"fileSizes":{"index.pck":3304,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
