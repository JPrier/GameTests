name: Build & deploy games

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          REL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/.local/godot
          curl -fsSL -o /tmp/godot.zip "$REL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq /tmp/godot.zip -d ~/.local/godot
          # Only pull the web templates out of the ~1.2 GB template archive (HTTP range requests).
          python3 .github/scripts/fetch-zip-members.py \
            "$REL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            "templates/version.txt" "templates/web_nothreads_debug.zip" "templates/web_nothreads_release.zip"

      - name: Validate, test and export every game
        run: |
          export GODOT_BIN=~/.local/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          bash .github/scripts/build-site.sh

      # Frame budget: every game, iPhone X class phone, 60 fps. Fails the build (and so the deploy).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache benchmark browser
        id: cache-browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('.github/bench/package.json') }}

      - name: Install benchmark browser
        working-directory: .github/bench
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npx playwright install-deps chromium-headless-shell
          if [ "${{ steps.cache-browser.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium-headless-shell
          fi

      - name: Benchmark every game (iPhone X, 60 fps)
        run: bash .github/scripts/bench-site.sh

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-budget
          path: _bench/results.json
          if-no-files-found: ignore

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
