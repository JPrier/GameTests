name: Build & deploy games

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]   # closed: remove the PR's preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  RUST_VERSION: 1.97.0

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + web export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          REL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/.local/godot
          curl -fsSL -o /tmp/godot.zip "$REL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq /tmp/godot.zip -d ~/.local/godot
          # Only pull the web templates out of the ~1.2 GB template archive (HTTP range requests).
          python3 .github/scripts/fetch-zip-members.py \
            "$REL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
            "templates/version.txt" "templates/web_nothreads_debug.zip" "templates/web_nothreads_release.zip"

      # Games with a prebuild.sh (Crowd Control's Rust simulation) build native + wasm code first.
      - name: Install Rust ${{ env.RUST_VERSION }} with the wasm target
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            games/**/sim/target
          key: cargo-${{ env.RUST_VERSION }}-${{ hashFiles('games/**/sim/Cargo.lock') }}

      - name: Validate, test and export every game
        run: |
          export GODOT_BIN=~/.local/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          chmod +x "$GODOT_BIN"
          bash .github/scripts/build-site.sh

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true   # .nojekyll
          retention-days: 7

  # Every game in Chromium, Firefox and WebKit, as a touch phone (with a rotation) and a desktop
  # with a mouse: boots, no page errors, canvas fills the screen, a button tap redraws it.
  browsers:
    if: github.event.action != 'closed'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Install Playwright (${{ matrix.browser }})
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Play every game (phone + desktop)
        run: node .github/tests/browsers.mjs _site --browsers ${{ matrix.browser }}
      - name: Self-test (a frozen screen must fail the check)
        if: matrix.browser == 'chromium'
        run: node .github/tests/browsers.mjs _site --browsers chromium --profiles phone --games drinkle,plans-tonight --self-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browsers-${{ matrix.browser }}-screenshots
          path: browsers-*.png
          if-no-files-found: ignore

  # Live site: the root of the gh-pages branch, leaving PR previews (pr-preview/) in place.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, browsers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

  # PR preview at https://joshprier.dev/GameTests/pr-preview/pr-<number>/, removed when the PR closes.
  preview:
    needs: build
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: site
          path: _site
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          umbrella-dir: pr-preview
          pages-base-url: joshprier.dev/GameTests
